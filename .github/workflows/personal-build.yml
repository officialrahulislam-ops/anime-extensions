      - name: Build APK
        run: |
          ./gradlew --no-daemon :src:en:sevenmmtv:spotlessApply
          ./gradlew --no-daemon :src:en:sevenmmtv:assembleDebug

      - name: Create repository files and validate index
        run: |
          cat > make_index.py <<'PYEOF'
          #!/usr/bin/env python3
          """Build the personal extension repository (apk/, icon/, index.json, index.min.json) from one built APK.

          Schema (per extension entry): name, pkg, apk, lang, code, version, nsfw, sources[{name, lang, id, baseUrl}]
          This follows the format produced by the upstream create-repo.py (aapt metadata + source list).
          """
          import argparse, glob, hashlib, json, os, re, shutil, subprocess, sys, zipfile

          BASE_URL = "https://7mmtv.sx"
          SOURCE_NAME = "7MMTV"


          def find_aapt():
              path = shutil.which("aapt")
              if path:
                  return path
              sdk = os.environ.get("ANDROID_HOME") or os.environ.get("ANDROID_SDK_ROOT") or ""
              cands = sorted(glob.glob(os.path.join(sdk, "build-tools", "*", "aapt")))
              if not cands:
                  sys.exit("aapt not found (Android SDK build-tools missing)")
              return cands[-1]


          def source_id(name, lang, version_id=1):
              key = f"{name.lower()}/{lang}/{version_id}"
              digest = hashlib.md5(key.encode()).digest()
              return int.from_bytes(digest[:8], "big") & 0x7FFFFFFFFFFFFFFF


          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument("--apk-dir", required=True)
              ap.add_argument("--out", required=True)
              ap.add_argument("--repo-url", default="")
              a = ap.parse_args()

              apks = glob.glob(os.path.join(a.apk_dir, "*.apk"))
              if len(apks) != 1:
                  sys.exit(f"expected exactly one APK in {a.apk_dir}, found {apks}")
              apk = apks[0]

              badging = subprocess.run([find_aapt(), "dump", "badging", apk], capture_output=True, text=True, check=True).stdout
              pkg = re.search(r"package: name='([^']+)'", badging).group(1)
              code = int(re.search(r"versionCode='([^']+)'", badging).group(1))
              version = re.search(r"versionName='([^']+)'", badging).group(1)
              label = re.search(r"^application-label:'([^']+)'", badging, re.M).group(1)
              icon_path = re.search(r"^application-icon-320:'([^']+)'", badging, re.M).group(1)
              nsfw_m = re.search(r"'tachiyomi\.animeextension\.nsfw' value='([^']+)'", badging)
              nsfw = int(nsfw_m.group(1)) if nsfw_m else 0

              m = re.match(r"eu\.kanade\.tachiyomi\.animeextension\.([^.]+)\.([^.]+)$", pkg)
              if not m:
                  sys.exit(f"unexpected package name: {pkg}")
              lang, short = m.group(1), m.group(2)

              out = a.out
              shutil.rmtree(out, ignore_errors=True)
              os.makedirs(os.path.join(out, "apk"))
              os.makedirs(os.path.join(out, "icon"))
              apk_name = f"aniyomi-{lang}.{short}-v{version}.apk"
              shutil.copy(apk, os.path.join(out, "apk", apk_name))
              with zipfile.ZipFile(apk) as z:
                  with open(os.path.join(out, "icon", f"{pkg}.png"), "wb") as f:
                      f.write(z.read(icon_path))

              index = [{
                  "name": label,
                  "pkg": pkg,
                  "apk": apk_name,
                  "lang": lang,
                  "code": code,
                  "version": version,
                  "nsfw": nsfw,
                  "sources": [{"name": SOURCE_NAME, "lang": lang, "id": str(source_id(SOURCE_NAME, lang)), "baseUrl": BASE_URL}],
              }]
              with open(os.path.join(out, "index.json"), "w", encoding="utf-8") as f:
                  json.dump(index, f, ensure_ascii=False, indent=2)
              with open(os.path.join(out, "index.min.json"), "w", encoding="utf-8") as f:
                  json.dump(index, f, ensure_ascii=False, separators=(",", ":"))

              # ---- validation: fail the build instead of publishing a broken index
              with open(os.path.join(out, "index.min.json"), encoding="utf-8") as f:
                  data = json.load(f)
              required = {"name", "pkg", "apk", "lang", "code", "version", "nsfw", "sources"}
              assert isinstance(data, list) and data, "index must be a non-empty list"
              for e in data:
                  assert required <= set(e), f"missing keys: {required - set(e)}"
                  assert os.path.isfile(os.path.join(out, "apk", e["apk"])), "apk file missing"
                  assert os.path.getsize(os.path.join(out, "apk", e["apk"])) > 10_000, "apk suspiciously small"
                  for s in e["sources"]:
                      assert {"name", "lang", "id", "baseUrl"} <= set(s), "bad source entry"
              print(f"OK: {pkg} {version} (code {code}), apk {apk_name}, nsfw={nsfw}")
              if a.repo_url:
                  print(f"Repository URL: {a.repo_url}/index.min.json")


          if __name__ == "__main__":
              main()
          PYEOF
          python3 make_index.py \
            --apk-dir src/en/sevenmmtv/build/outputs/apk/debug \
            --out dist \
            --repo-url "https://raw.githubusercontent.com/${{ github.repository }}/repo"
      - name: Publish to the repo branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -b repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" repo:repo

      - name: Check the published index is reachable
        run: |
          URL="https://raw.githubusercontent.com/${{ github.repository }}/repo/index.min.json"
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$URL" -o /tmp/index.min.json; then
              python3 -c "import json;d=json.load(open('/tmp/index.min.json'));print('Index OK:',d[0]['pkg'],d[0]['version'])"
              echo "Repository URL: $URL"
              exit 0
            fi
            sleep 10
          done
          echo "Could not download $URL - the repository must be public for Zangetsu to read it."
          exit 1

      - name: Keep the APK as a build artifact too
        uses: actions/upload-artifact@v4
        with:
          name: sevenmmtv-apk
          path: dist/apk/*.apk
