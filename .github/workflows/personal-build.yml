name: Personal 7MMTV build and publish

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/en/sevenmmtv/**'
      - '.github/workflows/personal-build.yml'

permissions:
  contents: write

concurrency:
  group: personal-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      # Speeds the build up a lot: only our extension is compiled.
      - name: Keep only the 7MMTV extension
        run: find src -mindepth 2 -maxdepth 2 -type d ! -path 'src/en/sevenmmtv' -exec rm -rf {} +

